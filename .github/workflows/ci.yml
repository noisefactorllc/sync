name: CI

# Every change to Sync is built and tested here before it can be released.
# This repository is public and holds no deployment credential: releasing is
# the Scaffold release harness's job, and it re-runs all of these gates against
# the exact commit it is asked to ship.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: sync-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native:
    name: macOS ${{ matrix.name }}
    runs-on: macos-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Release
            build_type: Release
            cxx_flags: ''
          - name: Warnings as errors
            build_type: Debug
            cxx_flags: '-Wall -Wextra -Wpedantic -Werror'
          - name: Address and undefined sanitizers
            build_type: Debug
            cxx_flags: '-fsanitize=address,undefined -fno-omit-frame-pointer'
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'

      - name: Install build dependencies
        run: brew install cmake pkg-config openssl@3 libuv

      - name: Configure and build
        shell: bash
        env:
          BUILD_TYPE: ${{ matrix.build_type }}
          EXTRA_CXX_FLAGS: ${{ matrix.cxx_flags }}
        run: |
          set -euo pipefail
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DCMAKE_CXX_FLAGS="$EXTRA_CXX_FLAGS" \
            -DCMAKE_OBJCXX_FLAGS="$EXTRA_CXX_FLAGS"
          cmake --build build --parallel 4

      - name: Run native tests
        run: ctest --test-dir build --output-on-failure

      - name: Run JavaScript unit tests and test coverage guard
        run: npm run test:unit

      - name: Run packaging tests
        run: npm run test:packaging

      - name: Run real-daemon loopback tests
        run: SYNC_DAEMON_PATH=build/syncd npm run test:integration

  linux:
    name: Ubuntu 24.04 x86_64 ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SYNC_VERSION: ${{ github.run_id }}.${{ github.run_attempt }}~ci
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Release
            build_type: Release
            cxx_flags: '-Wall -Wextra -Wpedantic -Werror'
            sanitizer: false
          - name: Warnings as errors
            build_type: Debug
            cxx_flags: '-Wall -Wextra -Wpedantic -Werror'
            sanitizer: false
          - name: Address and undefined sanitizers
            build_type: Debug
            cxx_flags: '-fsanitize=address,undefined -fno-omit-frame-pointer'
            sanitizer: true
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config libssl-dev libuv1-dev \
            dpkg-dev file procps

      - name: Configure and build
        env:
          BUILD_TYPE: ${{ matrix.build_type }}
          EXTRA_CXX_FLAGS: ${{ matrix.cxx_flags }}
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DSYNC_PRODUCT_VERSION="$SYNC_VERSION" \
            -DCMAKE_CXX_FLAGS="$EXTRA_CXX_FLAGS"
          cmake --build build --parallel 4

      - name: Run native tests
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1
        run: ctest --test-dir build --output-on-failure

      - name: Run browser and daemon tests
        run: |
          npm run test:unit
          SYNC_DAEMON_PATH=build/syncd npm run test:integration
          SYNC_DAEMON_PATH=build/syncd SYNC_CTL_PATH=build/syncctl \
            npm run test:integration:linux

      - name: Build and verify Debian package
        if: matrix.name == 'Release'
        run: |
          cmake --build build --target sync_linux_deb --parallel 4
          SYNC_PACKAGE_DIR=build/package npm run test:packaging:linux
          scripts/verify-linux-package.sh \
            "build/package/Sync-$SYNC_VERSION-linux-amd64.deb" "$SYNC_VERSION"
          sudo scripts/smoke-linux-package.sh \
            "$PWD/build/package/Sync-$SYNC_VERSION-linux-amd64.deb"

      - name: Upload Debian package
        if: matrix.name == 'Release'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sync-linux-amd64
          path: build/package/Sync-${{ env.SYNC_VERSION }}-linux-amd64.deb
          if-no-files-found: error

  linux-arm64:
    name: Ubuntu 24.04 ARM64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config libssl-dev libuv1-dev

      - name: Build and test the camera-free ARM64 surface
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS='-Wall -Wextra -Wpedantic -Werror'
          cmake --build build --parallel 4
          ctest --test-dir build --output-on-failure
          npm run test:unit

  windows:
    name: Windows ${{ matrix.name }}
    runs-on: windows-latest
    timeout-minutes: 60
    # Job scope, not step scope: a per-step env is easy to forget, and a
    # missing BUILD_TYPE does not fail loudly -- it expands to an empty
    # string and hands ctest an invalid --build-config.
    env:
      BUILD_TYPE: ${{ matrix.build_type }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Release
            build_type: Release
            # Empty means "add nothing". The configure step below skips the
            # flag entirely rather than passing an empty one -- on MSVC those
            # are not the same thing; see the comment there.
            cxx_flags: ''
          - name: Warnings as errors
            build_type: Debug
            # /W4 /WX is MSVC's equivalent of the -Wall -Wextra -Werror gate the
            # macOS matrix applies; /permissive- holds the same standards line.
            # /EHsc is not optional here: setting CMAKE_CXX_FLAGS replaces the
            # defaults CMake would otherwise supply on Windows, and dropping it
            # makes every file that uses exceptions emit C4530.
            cxx_flags: '/W4 /WX /permissive- /EHsc'
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'

      - name: Install build dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          vcpkg install libuv:x64-windows openssl:x64-windows
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install failed" }

      - name: Configure and build
        shell: pwsh
        env:
          EXTRA_CXX_FLAGS: ${{ matrix.cxx_flags }}
        run: |
          $ErrorActionPreference = 'Stop'
          $arguments = @(
            '-S', '.', '-B', 'build', '-A', 'x64',
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake",
            '-DVCPKG_TARGET_TRIPLET=x64-windows',
            "-DCMAKE_BUILD_TYPE=$env:BUILD_TYPE"
          )
          # Only pass CMAKE_CXX_FLAGS when the matrix entry actually has flags.
          # Passing it empty is not a no-op: it REPLACES CMake's Windows
          # defaults (/DWIN32 /D_WINDOWS /W3 /GR /EHsc). The one that mattered
          # was /EHsc -- without it MSVC runs no destructors during unwinding,
          # so this job was testing a binary that behaved differently from the
          # one we ship. (/GR is MSVC's default and stays on whether or not it
          # is named, so RTTI was never actually lost; the project now states
          # /EHsc itself, which is the real guarantee.)
          if ($env:EXTRA_CXX_FLAGS) {
            $arguments += "-DCMAKE_CXX_FLAGS=$env:EXTRA_CXX_FLAGS"
          }
          cmake @arguments
          if ($LASTEXITCODE -ne 0) { throw "configure failed" }
          cmake --build build --config $env:BUILD_TYPE --parallel 4
          if ($LASTEXITCODE -ne 0) { throw "build failed" }

      # Neither Spout nor NDI can initialise on a headless runner with no GPU
      # and no user-installed NDI runtime. That is exactly the state the
      # provider tests assert: absence must be graceful, never a crash.
      - name: Run native tests
        shell: pwsh
        run: |
          # The camera end-to-end test needs a registered media source and a
          # Windows 11 build, so it is excluded here and run by its own step
          # below, which sets both up. Everything else -- including the whole
          # media source driven in process -- runs on any Windows image.
          ctest --test-dir build --build-config $env:BUILD_TYPE --output-on-failure `
            --label-exclude sync_camera_e2e
          if ($LASTEXITCODE -ne 0) { throw "ctest failed" }

      # Registration first, then the probe. The probe walks the whole path --
      # create the registered CLSID, activate the source, ask it for every
      # required interface, then MFCreateVirtualCamera and Start -- and on an
      # unregistered machine it stops at the first step with
      # REGDB_E_CLASSNOTREG, which says nothing about whether this image can
      # host a camera. Probing before registering asked a question it could
      # not answer.
      #
      # A hosted runner is an administrator, so registration needs no prompt.
      - name: Register the camera source and probe this runner's camera support
        id: camera_capability
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & "build/$env:BUILD_TYPE/syncd.exe" --register-camera
          if ($LASTEXITCODE -ne 0) { throw "camera registration failed" }
          & "build/$env:BUILD_TYPE/sync_camera_capability_probe.exe" |
            Tee-Object -FilePath camera-capability.txt
          $verdict = $LASTEXITCODE
          "verdict=$verdict" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Get-Content camera-capability.txt | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          # Capability is reported, never asserted: the step below decides.
          exit 0

      # The gate. Runs wherever the image can actually host a virtual camera;
      # where it cannot, the step below records that rather than failing the
      # job for something the runner is incapable of.
      - name: Run the end-to-end camera test
        if: steps.camera_capability.outputs.verdict == '0'
        shell: pwsh
        run: |
          ctest --test-dir build --build-config $env:BUILD_TYPE --output-on-failure `
            --label-regex sync_camera_e2e
          if ($LASTEXITCODE -ne 0) { throw "virtual camera end-to-end test failed" }

      - name: Record that this runner cannot host a virtual camera
        if: steps.camera_capability.outputs.verdict != '0'
        shell: pwsh
        run: |
          $verdict = "${{ steps.camera_capability.outputs.verdict }}"
          $note = "This runner image cannot host a Media Foundation virtual " +
                  "camera (probe verdict $verdict), so the end-to-end camera " +
                  "test did not run here. Everything beneath it -- the media " +
                  "source driven in process through its own DLL, the ring, " +
                  "the conversion -- did. The end-to-end gate needs a runner " +
                  "that can, and the per-step HRESULTs above say which call " +
                  "this image refused."
          Write-Host $note
          $note | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Unregister the camera source
        if: always()
        shell: pwsh
        run: |
          # always(), so a failed test does not leave a registered camera
          # behind on a reused runner.
          & "build/$env:BUILD_TYPE/syncd.exe" --unregister-camera
          exit 0

      - name: Run JavaScript unit tests and test coverage guard
        env:
          SYNC_DAEMON_PATH: build/${{ env.BUILD_TYPE }}/syncd.exe
        run: npm run test:unit

      - name: Run packaging tests
        run: npm run test:packaging

      - name: Run real-daemon loopback tests
        shell: pwsh
        run: |
          $env:SYNC_DAEMON_PATH = "build/$env:BUILD_TYPE/syncd.exe"
          npm run test:integration
          if ($LASTEXITCODE -ne 0) { throw "integration tests failed" }

  windows-package:
    name: Windows package
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'

      - name: Install build and packaging dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          vcpkg install libuv:x64-windows openssl:x64-windows
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install failed" }
          choco install --no-progress --yes innosetup imagemagick.tool
          if ($LASTEXITCODE -ne 0) { throw "choco install failed" }
          # Neither tool lands on PATH for the steps that follow, and both are
          # hard requirements of the packaging target -- a missing `magick`
          # only surfaces much later, as a confusing "the build did not
          # produce Sync.ico". Resolve both now and fail here if either is
          # genuinely absent.
          $innoDir = "C:\Program Files (x86)\Inno Setup 6"
          if (-not (Test-Path (Join-Path $innoDir "ISCC.exe"))) {
            throw "Inno Setup did not install to $innoDir"
          }
          $magick = Get-ChildItem -Path "C:\ProgramData\chocolatey\lib\imagemagick.tool" `
            -Filter magick.exe -Recurse -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if ($null -eq $magick) { throw "magick.exe not found after choco install" }
          $innoDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $magick.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # Spout is BSD-2-Clause and therefore redistributable, so the packaged
      # app carries a pinned build of SpoutLibrary.dll. The release workflow
      # supplies a real pinned artifact; CI builds a placeholder so the
      # packaging path itself is exercised on every change.
      - name: Stage a placeholder Spout module
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path "$env:RUNNER_TEMP\spout" -Force | Out-Null
          Copy-Item "$env:SystemRoot\System32\version.dll" `
            "$env:RUNNER_TEMP\spout\SpoutLibrary.dll"

      - name: Configure and build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake -S . -B build-package -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DCMAKE_BUILD_TYPE=Release `
            -DSYNC_SPOUT_LIBRARY_PATH="$env:RUNNER_TEMP\spout\SpoutLibrary.dll" `
            -DSYNC_WINDOWS_DEPENDENCY_PATH="$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin"
          if ($LASTEXITCODE -ne 0) { throw "configure failed" }
          cmake --build build-package --config Release --target sync_windows_installer --parallel 4
          if ($LASTEXITCODE -ne 0) { throw "packaging failed" }

      - name: Verify the packaged bundle
        shell: pwsh
        run: |
          $env:SYNC_PACKAGE_DIR = "build-package/package"
          node --test test/packaging/windows-package.test.js
          if ($LASTEXITCODE -ne 0) { throw "packaging tests failed" }

      - name: Smoke the installed app lifecycle
        shell: pwsh
        run: |
          ./scripts/smoke-windows-app.ps1 -Bundle "$PWD/build-package/package/Sync"
          if ($LASTEXITCODE -ne 0) { throw "smoke test failed" }

  scripts:
    name: Packaging scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Lint packaging and smoke scripts
        shell: bash
        run: |
          set -euo pipefail
          shellcheck --severity=warning scripts/*.sh
          for SCRIPT in scripts/*.sh; do bash -n "$SCRIPT"; done

      - name: Lint PowerShell packaging scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser -SkipPublisherCheck
          $findings = Invoke-ScriptAnalyzer -Path scripts -Recurse -Severity Error, Warning
          if ($findings) {
            $findings | Format-Table -AutoSize | Out-String | Write-Host
            throw "PSScriptAnalyzer reported $($findings.Count) finding(s)"
          }
