name: Scaffold Windows process containment

on:
  workflow_dispatch:
    inputs:
      scaffold_sha:
        description: Reviewed full Scaffold SHA, which must equal its published main head
        required: true
        type: string

permissions:
  contents: read

# Queue behind camera work. A subsequent camera gate may cancel this qualification.
concurrency:
  group: sync-camera-e2e
  cancel-in-progress: false

jobs:
  containment:
    name: Windows process containment ${{ inputs.scaffold_sha }}
    if: github.repository == 'noisefactorllc/sync' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64, sync-camera]
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    env:
      SCAFFOLD_SOURCE_SHA: ${{ inputs.scaffold_sha }}
    steps:
      - name: Verify the existing host and retain its baseline
        id: baseline
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location -LiteralPath $env:RUNNER_TEMP
          if ($env:SCAFFOLD_SOURCE_SHA -cnotmatch '^[a-f0-9]{40}$') { throw 'A full reviewed Scaffold SHA is required' }
          if ($env:COMPUTERNAME -ne 'LARGEBOI' -or $env:RUNNER_NAME -ne 'largeboi-sync-camera') { throw 'Unexpected Windows runner' }
          if ([Diagnostics.Process]::GetCurrentProcess().SessionId -eq 0) { throw 'An interactive session is required' }
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $principal = [Security.Principal.WindowsPrincipal]::new($identity)
          if ($principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) { throw 'Qualification must remain unelevated' }
          if ($identity.Name -ne 'LARGEBOI\aayar') { throw 'Unexpected runner identity' }
          if ([IO.Path]::GetFullPath($env:GITHUB_WORKSPACE) -ne 'C:\actions-runner-sync\_work\sync\sync') { throw 'Unexpected camera workspace' }
          $root = Join-Path $env:RUNNER_TEMP "scaffold-windows-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if (Test-Path -LiteralPath $root) { throw 'Qualification directory already exists' }
          [IO.Directory]::CreateDirectory($root) | Out-Null
          [IO.Directory]::CreateDirectory((Join-Path $root 'evidence')) | Out-Null
          [IO.Directory]::CreateDirectory((Join-Path $root 'scratch')) | Out-Null
          "SCAFFOLD_WINDOWS_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "evidence_ready=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          $runner = Split-Path (Split-Path $env:RUNNER_TEMP -Parent) -Parent
          $node = Join-Path $runner 'externals/node24/bin/node.exe'
          $nodeFile = Get-Item -LiteralPath $node -ErrorAction SilentlyContinue
          $regular = $null -ne $nodeFile -and -not $nodeFile.PSIsContainer -and -not ($nodeFile.Attributes -band [IO.FileAttributes]::ReparsePoint)
          @{ executable = $node; exists = $null -ne $nodeFile; regular = $regular } |
            ConvertTo-Json | Set-Content -LiteralPath (Join-Path $root 'evidence/runtime.json') -Encoding utf8
          if (-not $regular) { throw 'The existing Node runtime must be a regular executable' }
          $nodeRuntime = & $node -p 'JSON.stringify({version:process.versions.node, platform:process.platform, arch:process.arch})' | ConvertFrom-Json
          $nodeExit = $LASTEXITCODE
          @{ executable = $node; regular = $regular; version = $nodeRuntime.version; sha256 = (Get-FileHash -LiteralPath $node -Algorithm SHA256).Hash;
             platform = $nodeRuntime.platform; architecture = $nodeRuntime.arch; powershell_version = $PSVersionTable.PSVersion.ToString() } |
            ConvertTo-Json | Set-Content -LiteralPath (Join-Path $root 'evidence/runtime.json') -Encoding utf8
          if ($nodeExit -ne 0 -or $nodeRuntime.platform -ne 'win32' -or $nodeRuntime.arch -ne 'x64' -or [version]$nodeRuntime.version -lt [version]'24.13.0') {
            throw 'The existing runner Node runtime is unsupported'
          }
          "SCAFFOLD_WINDOWS_NODE=$node" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          # This script only reads the registration, scheduled task, and existing workspace.
          $snapshot = @'
          $ErrorActionPreference = 'Stop'
          $runner = Split-Path (Split-Path $env:RUNNER_TEMP -Parent) -Parent
          $registration = @{}
          foreach ($name in @('.runner', '.credentials', '.credentials_rsaparams')) {
            $path = Join-Path $runner $name
            if (Test-Path -LiteralPath $path) { $registration[$name] = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash }
            elseif ($name -eq '.credentials_rsaparams') { $registration[$name] = $null }
            else { throw 'Expected runner registration file is missing' }
          }
          $inventory = @(Get-ChildItem -LiteralPath $env:GITHUB_WORKSPACE -Recurse -Force -File |
            ForEach-Object { $_.FullName + '|' + $_.Length + '|' + $_.LastWriteTimeUtc.Ticks } | Sort-Object)
          $workspace = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes(($inventory -join "`n"))))
          $key = Get-Item 'HKLM:\SOFTWARE\Classes\CLSID\{2F8E7B14-9C3D-4A62-B5E1-7D4A9F2C6B08}\InprocServer32'
          $task = Get-ScheduledTask -TaskName 'GitHub Actions Runner - sync-camera'
          $listeners = @(Get-Process -Name 'Runner.Listener' | ForEach-Object { @{ id = $_.Id; started = $_.StartTime.ToUniversalTime().Ticks } } | Sort-Object { $_.id })
          if ($listeners.Count -eq 0) { throw 'The existing runner listener is missing' }
          @{ registration = $registration; workspace = $workspace; camera = $key.GetValue('');
             task = @{ user = $task.Principal.UserId; logon = [string]$task.Principal.LogonType; level = [string]$task.Principal.RunLevel };
             listeners = $listeners } | ConvertTo-Json -Depth 6 -Compress
          '@
          $snapshotPath = Join-Path $root 'snapshot.ps1'
          [IO.File]::WriteAllText($snapshotPath, $snapshot)
          & $snapshotPath | Set-Content -LiteralPath (Join-Path $root 'host-before.json') -Encoding utf8
          "ready=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Mint a Scaffold contents-read token
        id: source-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: Iv23liy6T6BW0BXuZRzx
          private-key: ${{ secrets.EHSRE_APP_PRIVATE_KEY }}
          owner: noisefactorllc
          repositories: scaffold
          permission-contents: read

      - name: Download only the reviewed containment source into runner temp
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ steps.source-token.outputs.token }}
          script: |
            const fs = require('node:fs/promises');
            const path = require('node:path');
            const crypto = require('node:crypto');
            const owner = 'noisefactorllc', repo = 'scaffold', sha = process.env.SCAFFOLD_SOURCE_SHA;
            if (!/^[a-f0-9]{40}$/.test(sha)) throw new Error('Invalid source identity');
            const metadata = (await github.rest.repos.get({ owner, repo })).data;
            if (metadata.default_branch !== 'main' || metadata.permissions?.push === true) throw new Error('Source credential must be read-only');
            const head = (await github.rest.repos.getCommit({ owner, repo, ref: 'main' })).data;
            if (head.sha !== sha) throw new Error('Reviewed source must equal published Scaffold main');
            const tree = (await github.rest.git.getTree({ owner, repo, tree_sha: head.commit.tree.sha, recursive: '1' })).data;
            if (tree.truncated || !Array.isArray(tree.tree)) throw new Error('Source inventory is incomplete');
            const files = [
              'apps/scaffold-cloud/native-worker.mjs',
              'apps/scaffold-cloud/lib/contract.mjs',
              'apps/scaffold-cloud/lib/engines.mjs',
              'apps/scaffold-cloud/lib/executor.mjs',
              'apps/scaffold-cloud/lib/native-lock.mjs',
              'apps/scaffold-cloud/lib/native.mjs',
              'apps/scaffold-cloud/lib/runner.mjs',
              'apps/scaffold-cloud/lib/skill-worker.mjs',
              'apps/scaffold-cloud/lib/skills.mjs',
              'apps/scaffold-cloud/lib/windows-process.mjs',
              'apps/scaffold-cloud/lib/worker.mjs',
              'apps/scaffold-cloud/runtime/windows-process.cs',
              'apps/scaffold-cloud/runtime/windows-process.ps1',
              'apps/scaffold-cloud/test/windows-process.test.mjs',
              'apps/scaffold-cloud/test/fixtures/windows-process-child.mjs',
              'apps/scaffold-cloud/test/fixtures/windows-process-breakaway.ps1',
            ];
            const root = process.env.SCAFFOLD_WINDOWS_ROOT;
            if (!root || path.dirname(root).toLowerCase() !== path.resolve(process.env.RUNNER_TEMP).toLowerCase()) throw new Error('Invalid qualification directory');
            const manifest = { repository: `${owner}/${repo}`, source_sha: sha, files: [] };
            for (const file of files) {
              const entries = tree.tree.filter(entry => entry.path === file);
              if (entries.length !== 1 || entries[0].type !== 'blob' || !['100644', '100755'].includes(entries[0].mode)) throw new Error('Source must contain regular files');
              const blob = (await github.rest.git.getBlob({ owner, repo, file_sha: entries[0].sha })).data;
              if (blob.encoding !== 'base64' || blob.size > 2097152) throw new Error('Invalid source blob');
              const data = Buffer.from(blob.content, 'base64');
              if (data.length !== blob.size) throw new Error('Incomplete source blob');
              const actualBlob = crypto.createHash('sha1').update(`blob ${data.length}\0`).update(data).digest('hex');
              if (actualBlob !== entries[0].sha) throw new Error('Source blob identity mismatch');
              const target = path.join(root, file);
              await fs.mkdir(path.dirname(target), { recursive: true });
              await fs.writeFile(target, data, { flag: 'wx' });
              manifest.files.push({ path: file, sha256: crypto.createHash('sha256').update(data).digest('hex') });
            }
            await fs.writeFile(path.join(root, 'evidence', 'source-manifest.json'), JSON.stringify(manifest, null, 2), { flag: 'wx' });

      - name: Inventory installed native engines without launching them
        timeout-minutes: 2
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location -LiteralPath $env:RUNNER_TEMP
          $root = $env:SCAFFOLD_WINDOWS_ROOT
          $formatter = @'
          import assert from 'node:assert/strict';
          import { readFile, writeFile } from 'node:fs/promises';
          function publicInventory(raw, source) {
            const require = value => { if (!value) throw new Error('Invalid engine inventory metadata.'); };
            const text = value => { require(typeof value === 'string' && value.length > 0 && value.length <= 512 && !/[\u0000-\u001f\u007f]/.test(value)); return value; };
            const optional = value => value === null || value === '' ? null : text(value);
            const family = value => { require(['unity', 'godot', 'touchdesigner', 'blender', 'houdini', 'unreal'].includes(value)); return value; };
            const path = value => {
              if (value === null || value === '') return null;
              text(value); require(/^[A-Za-z]:\\/.test(value) && !/[/%]/.test(value));
              const parts = value.slice(3).split('\\');
              if (parts.at(-1) === '') parts.pop();
              require(parts.every(part => part.length > 0 && !/[<>:"|?*]/.test(part) && !/[. ]$/.test(part)));
              return value.replace(/^[A-Za-z]:\\Users\\[^\\]+/i, '<user-profile>');
            };
            const rows = (values, project) => {
              require(Array.isArray(values) && values.length <= 128);
              return values.map(value => { require(value && typeof value === 'object' && !Array.isArray(value)); return project(value); });
            };
            require(raw && /^[a-f0-9]{40}$/.test(source));
            const complete = Object.fromEntries(['registry', 'directories', 'path', 'gpu', 'processes'].map(key => {
              require(typeof raw.complete?.[key] === 'boolean'); return [key, raw.complete[key]];
            }));
            return { schema_version: 1, source_sha: source, inventory_only: true, license_status: 'not_inspected',
              scope: 'registry_known_directories_and_path', complete,
              registry: rows(raw.registry, value => ({ engine: family(value.engine), name: text(value.name), version: optional(value.version), path: path(value.path) })),
              executables: rows(raw.executables, value => {
                require(typeof value.sha256 === 'string' && /^[a-f0-9]{64}$/i.test(value.sha256));
                const executable = path(value.path); require(executable !== null);
                return { engine: family(value.engine), path: executable, version: optional(value.version), sha256: value.sha256.toLowerCase() };
              }),
              gpu: rows(raw.gpu, value => ({ name: text(value.name), driver: optional(value.driver) })),
              processes: rows(raw.processes, value => {
                require(Number.isSafeInteger(value.pid) && value.pid > 0 && value.pid <= 4294967295);
                require(typeof value.started === 'string' && /^\d{4}-\d{2}-\d{2}T[\d:.]+Z$/.test(value.started) && Number.isFinite(Date.parse(value.started)));
                return { engine: family(value.engine), pid: value.pid, started: value.started };
              }) };
          }
          if (process.argv[2] === '--self-test') {
            const source = 'a'.repeat(40);
            const raw = { complete: { registry: true, directories: true, path: true, gpu: true, processes: true },
              registry: [{ engine: 'unity', name: 'Unity 6000.3.16f1', version: '6000.3.16f1', path: 'C:\\Program Files\\Unity', license: 'private-license' }],
              executables: [{ engine: 'godot', path: 'C:\\Users\\private-user\\Tools\\Godot.exe', version: '4.5', sha256: 'B'.repeat(64), environment: 'private-environment' }],
              gpu: [{ name: 'NVIDIA GPU', driver: '32.0.15.0000', serial: 'private-serial' }],
              processes: [{ engine: 'unity', pid: 123, started: '2026-09-25T10:00:00.0000000Z', command_line: 'private-command' }],
              environment: 'private-token' };
            const result = publicInventory(raw, source);
            assert.deepEqual(result, { schema_version: 1, source_sha: source, inventory_only: true, license_status: 'not_inspected',
              scope: 'registry_known_directories_and_path', complete: raw.complete,
              registry: [{ engine: 'unity', name: 'Unity 6000.3.16f1', version: '6000.3.16f1', path: 'C:\\Program Files\\Unity' }],
              executables: [{ engine: 'godot', path: '<user-profile>\\Tools\\Godot.exe', version: '4.5', sha256: 'b'.repeat(64) }],
              gpu: [{ name: 'NVIDIA GPU', driver: '32.0.15.0000' }],
              processes: [{ engine: 'unity', pid: 123, started: '2026-09-25T10:00:00.0000000Z' }] });
            assert.ok(!JSON.stringify(result).includes('private-'));
            assert.equal(publicInventory({ ...raw, complete: { ...raw.complete, path: false } }, source).complete.path, false);
            for (const change of [
              { complete: { registry: true } }, { registry: Array(129).fill(raw.registry[0]) },
              { executables: [{ ...raw.executables[0], path: '\\\\server\\share\\Godot.exe' }] },
              { executables: [{ ...raw.executables[0], path: 'C:\\Tools\\..\\Godot.exe' }] },
              { executables: [{ ...raw.executables[0], sha256: 'private-hash' }] },
              { processes: [{ ...raw.processes[0], pid: 0 }] }, { gpu: [{ name: 'private\nvalue', driver: '1' }] },
              { registry: [{ ...raw.registry[0], engine: 'unknown' }] },
            ]) assert.throws(() => publicInventory({ ...raw, ...change }, source), { message: 'Invalid engine inventory metadata.' });
            for (const path of ['C:\\Users/private-user\\Tools\\Godot.exe', 'C:\\Users\\.\\private-user\\Tools\\Godot.exe',
              'C:\\Users\\\\private-user\\Tools\\Godot.exe', 'C:\\Users.\\private-user\\Tools\\Godot.exe',
              'C:\\Users \\private-user\\Tools\\Godot.exe', 'C:\\Users\\private-user.\\Tools\\Godot.exe']) {
              for (const category of ['registry', 'executables']) {
                assert.throws(() => publicInventory({ ...raw, [category]: [{ ...raw[category][0], path }] }, source),
                  { message: 'Invalid engine inventory metadata.' });
              }
            }
            assert.equal(publicInventory({ ...raw, registry: [{ ...raw.registry[0], path: 'c:\\uSeRs\\private-user\\Tools\\' }] }, source).registry[0].path,
              '<user-profile>\\Tools\\');
            assert.equal(publicInventory({ ...raw, executables: [{ ...raw.executables[0], path: 'c:\\uSeRs\\private-user\\Tools\\Godot.exe' }] }, source).executables[0].path,
              '<user-profile>\\Tools\\Godot.exe');
            assert.throws(() => publicInventory(raw, 'unreviewed'), { message: 'Invalid engine inventory metadata.' });
            process.stdout.write('Engine inventory receipt checks passed.\n');
          } else {
            const [input, output, source] = process.argv.slice(2);
            const text = await readFile(input, 'utf8');
            if (Buffer.byteLength(text) > 1048576) throw new Error('Engine inventory exceeds its bound.');
            await writeFile(output, JSON.stringify(publicInventory(JSON.parse(text.replace(/^\uFEFF/, '')), source), null, 2), { flag: 'wx' });
          }
          '@
          $formatterPath = Join-Path $root 'engine-inventory.mjs'
          [IO.File]::WriteAllText($formatterPath, $formatter)
          & $env:SCAFFOLD_WINDOWS_NODE $formatterPath --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Engine inventory receipt checks failed' }
          $inventory = @{ complete = @{ registry = $true; directories = $true; path = $true; gpu = $true; processes = $true };
            registry = @(); executables = @(); gpu = @(); processes = @() }
          function Get-EngineFamily([string]$name) {
            switch -Regex ($name) {
              '^Unity(\b|Hub)' { return 'unity' }
              '^Godot(\b|[_ .-])' { return 'godot' }
              '^Touch(Designer|Player)(\b|[_ .-])' { return 'touchdesigner' }
              '^Blender\b' { return 'blender' }
              '^(Houdini\b|hbatch\b|hython\b)' { return 'houdini' }
              '^(Unreal( Engine|Editor)?\b|UE4Editor\b)' { return 'unreal' }
            }
            return $null
          }
          function Test-RegularPath($item) {
            if ($null -eq $item -or $item.FullName -notmatch '^[A-Za-z]:\\') { return $false }
            $current = $item
            while ($null -ne $current) {
              if ($current.Attributes -band [IO.FileAttributes]::ReparsePoint) { return $false }
              $current = if ($current -is [IO.DirectoryInfo]) { $current.Parent } else { $current.Directory }
            }
            return $true
          }
          # Read only application identity fields, never license keys or uninstall commands.
          foreach ($key in @('HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall',
            'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall',
            'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall')) {
            try {
              if (-not (Test-Path -LiteralPath $key)) { continue }
              $entries = @(Get-ChildItem -LiteralPath $key | Select-Object -First 2049)
              if ($entries.Count -gt 2048) { $inventory.complete.registry = $false }
              foreach ($entry in $entries | Select-Object -First 2048) {
                $name = $entry.GetValue('DisplayName', $null, [Microsoft.Win32.RegistryValueOptions]::DoNotExpandEnvironmentNames)
                $family = Get-EngineFamily $name
                if (-not $family) { continue }
                if ($inventory.registry.Count -ge 128) { $inventory.complete.registry = $false; break }
                $inventory.registry += @{ engine = $family; name = $name;
                  version = $entry.GetValue('DisplayVersion', $null, [Microsoft.Win32.RegistryValueOptions]::DoNotExpandEnvironmentNames);
                  path = $entry.GetValue('InstallLocation', $null, [Microsoft.Win32.RegistryValueOptions]::DoNotExpandEnvironmentNames) }
              }
            } catch { $inventory.complete.registry = $false }
          }
          $candidates = @{}
          function Add-EngineCandidate($item, [string]$section) {
            if ($item.PSIsContainer -or -not (Get-EngineFamily $item.BaseName)) { return }
            if (-not (Test-RegularPath $item)) { $inventory.complete[$section] = $false; return }
            if ($candidates.Count -ge 128 -and -not $candidates.ContainsKey($item.FullName)) { $inventory.complete[$section] = $false; return }
            $candidates[$item.FullName] = $item
          }
          # Each glob is a bounded known installation path; never recurse through user files.
          $patterns = @('Unity\Hub\Editor\*\Editor\Unity.exe', 'Unity\Editor\Unity.exe',
            'Godot\Godot*.exe', 'Derivative\TouchDesigner*\bin\TouchDesigner.exe',
            'Derivative\TouchDesigner*\TouchDesigner.exe', 'Blender Foundation\Blender*\blender.exe',
            'Side Effects Software\Houdini*\bin\houdini.exe', 'Epic Games\UE_*\Engine\Binaries\Win64\UnrealEditor.exe')
          foreach ($base in @($env:ProgramFiles, [Environment]::GetEnvironmentVariable('ProgramFiles(x86)')) | Where-Object { $_ } | Select-Object -Unique) {
            foreach ($pattern in $patterns) {
              try {
                $parent = Get-Item -LiteralPath $base
                if (-not (Test-RegularPath $parent)) { $inventory.complete.directories = $false; continue }
                $directories = @($parent); $parts = $pattern.Split('\')
                for ($depth = 0; $depth -lt $parts.Count; $depth++) {
                  $next = @()
                  foreach ($directory in $directories) {
                    $items = @(Get-ChildItem -LiteralPath $directory.FullName -Filter $parts[$depth] | Select-Object -First 129)
                    if ($items.Count -gt 128) { $inventory.complete.directories = $false }
                    foreach ($item in $items | Select-Object -First 128) {
                      if ($depth -eq $parts.Count - 1) { Add-EngineCandidate $item 'directories' }
                      elseif ($item.PSIsContainer) {
                        if ((Test-RegularPath $item) -and $next.Count -lt 128) { $next += $item } else { $inventory.complete.directories = $false }
                      }
                    }
                  }
                  $directories = $next
                }
              } catch { $inventory.complete.directories = $false }
            }
          }
          foreach ($name in @('Unity.exe', 'Godot*.exe', 'TouchDesigner.exe', 'TouchPlayer.exe', 'blender.exe', 'houdini.exe', 'hbatch.exe', 'hython.exe', 'UnrealEditor.exe', 'UE4Editor.exe')) {
            try {
              $commands = @(Get-Command -Name $name -CommandType Application -All -ErrorAction SilentlyContinue | Select-Object -First 129)
              if ($commands.Count -gt 128) { $inventory.complete.path = $false }
              foreach ($command in $commands | Select-Object -First 128) {
                if ($command.Source -notmatch '^[A-Za-z]:\\') { $inventory.complete.path = $false; continue }
                Add-EngineCandidate (Get-Item -LiteralPath $command.Source) 'path'
              }
            } catch { $inventory.complete.path = $false }
          }
          $hashedBytes = 0L
          foreach ($item in $candidates.Values | Sort-Object FullName) {
            try {
              if ($item.Length -gt 536870912 -or $hashedBytes + $item.Length -gt 2147483648) {
                $inventory.complete.directories = $false; $inventory.complete.path = $false; continue
              }
              $hashedBytes += $item.Length
              $inventory.executables += @{ engine = Get-EngineFamily $item.BaseName; path = $item.FullName;
                version = $item.VersionInfo.ProductVersion; sha256 = (Get-FileHash -LiteralPath $item.FullName -Algorithm SHA256).Hash }
            } catch { $inventory.complete.directories = $false; $inventory.complete.path = $false }
          }
          try {
            $gpus = @(Get-CimInstance Win32_VideoController | Select-Object -First 129)
            if ($gpus.Count -gt 128) { $inventory.complete.gpu = $false }
            $inventory.gpu = @($gpus | Select-Object -First 128 | ForEach-Object { @{ name = $_.Name; driver = $_.DriverVersion } })
          } catch { $inventory.complete.gpu = $false }
          try {
            $processes = @(Get-Process -Name 'Unity', 'UnityHub', 'Godot*', 'TouchDesigner*', 'TouchPlayer*', 'blender', 'houdini', 'hbatch', 'hython', 'UnrealEditor', 'UE4Editor' -ErrorAction SilentlyContinue | Select-Object -First 129)
            if ($processes.Count -gt 128) { $inventory.complete.processes = $false }
            foreach ($process in $processes | Select-Object -First 128) {
              $inventory.processes += @{ engine = Get-EngineFamily $process.ProcessName; pid = $process.Id;
                started = $process.StartTime.ToUniversalTime().ToString('o') }
            }
          } catch { $inventory.complete.processes = $false }
          $inputPath = Join-Path $root 'engine-inventory-private.json'
          $inventory | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath $inputPath -Encoding utf8
          & $env:SCAFFOLD_WINDOWS_NODE $formatterPath $inputPath (Join-Path $root 'evidence/engine-inventory.json') $env:SCAFFOLD_SOURCE_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Engine inventory metadata could not be safely recorded' }

      - name: Run actual Windows process containment tests
        env:
          SCAFFOLD_WINDOWS_QUALIFICATION: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location -LiteralPath $env:RUNNER_TEMP
          $env:TEMP = Join-Path $env:SCAFFOLD_WINDOWS_ROOT 'scratch'
          $env:TMP = $env:TEMP
          $test = Join-Path $env:SCAFFOLD_WINDOWS_ROOT 'apps/scaffold-cloud/test/windows-process.test.mjs'
          $log = Join-Path $env:SCAFFOLD_WINDOWS_ROOT 'evidence/windows-process.tap'
          & $env:SCAFFOLD_WINDOWS_NODE --test --test-reporter=tap $test 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { throw 'Windows process containment tests failed' }
          $text = Get-Content -LiteralPath $log -Raw
          if ($text -notmatch '(?m)^# skipped 0\s*$' -or $text -notmatch '(?m)^# fail 0\s*$' -or $text -notmatch '(?m)^# tests 28\s*$') {
            throw 'The complete Windows containment inventory must run without skips'
          }

      - name: Verify the camera host and workspace were preserved
        if: always() && steps.baseline.outputs.ready == 'true'
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location -LiteralPath $env:RUNNER_TEMP
          $root = $env:SCAFFOLD_WINDOWS_ROOT
          $before = Get-Content -LiteralPath (Join-Path $root 'host-before.json') -Raw | ConvertFrom-Json -AsHashtable
          $after = & (Join-Path $root 'snapshot.ps1') | ConvertFrom-Json -AsHashtable
          $components = [ordered]@{ registration = $true; workspace = $before.workspace -eq $after.workspace;
            camera = $before.camera -eq $after.camera; task = $true; listeners = $true }
          foreach ($name in $before.registration.Keys) { if ($before.registration[$name] -ne $after.registration[$name]) { $components.registration = $false } }
          foreach ($name in $before.task.Keys) { if ($before.task[$name] -ne $after.task[$name]) { $components.task = $false } }
          $beforeListeners = @($before.listeners | Sort-Object -Property id, started)
          $afterListeners = @($after.listeners | Sort-Object -Property id, started)
          if ($beforeListeners.Count -ne $afterListeners.Count) { $components.listeners = $false }
          else {
            for ($index = 0; $index -lt $beforeListeners.Count; $index++) {
              if ($beforeListeners[$index].id -ne $afterListeners[$index].id -or $beforeListeners[$index].started -ne $afterListeners[$index].started) {
                $components.listeners = $false
              }
            }
          }
          $preserved = -not ($components.Values -contains $false)
          $remaining = @(Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -and $_.CommandLine.Contains($root) -and $_.ProcessId -ne $PID })
          $evidence = @{ source_sha = $env:SCAFFOLD_SOURCE_SHA; runner = $env:RUNNER_NAME; os = [Environment]::OSVersion.VersionString;
            host_preserved = $preserved; components = $components; remaining_invocation_processes = $remaining.Count;
            remaining_invocation_identities = @($remaining | ForEach-Object { @{ pid = $_.ProcessId; parent_pid = $_.ParentProcessId;
              name = $_.Name; created_at = $_.CreationDate.ToUniversalTime().ToString('o') } }) }
          $evidence | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath (Join-Path $root 'evidence/host-preservation.json') -Encoding utf8
          if (-not $preserved -or $remaining.Count -ne 0) { throw 'Qualification did not preserve the host or confirm process cleanup' }

      - name: Retain qualification results without uploading private source
        if: always() && steps.baseline.outputs.evidence_ready == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-containment-${{ inputs.scaffold_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.SCAFFOLD_WINDOWS_ROOT }}/evidence/
          if-no-files-found: error
          retention-days: 30
