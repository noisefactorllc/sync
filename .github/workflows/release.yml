name: Request Sync preview release
run-name: Request Sync preview release for ${{ github.event.workflow_run.head_sha }}

# Sync is public and holds no deployment credential. Building, signing,
# notarizing, and publishing to downloads.noisefactor.io all happen in the
# private release harness, which is the sole holder of the Developer ID
# certificate, the Apple notarization credentials, and the deploy key.
# This workflow only asks that harness to release a specific commit, using a
# GitHub App token scoped to dispatching it.
#
# It runs when either of the two gates completes, never on push, and proposes
# a commit only after both have passed against that exact SHA:
#   - CI, with every product job successful (native, browser and loopback);
#   - Camera end-to-end, the Windows camera gate that CI cannot assert.
# scripts/release-request.mjs reads both runs, asks once per commit, and
# decides product scope from every commit since the last requested one. The
# run name carries the commit so a later run can find the last request. The
# harness independently re-runs those gates, plus notarization and
# physical-hardware acceptance, and refuses any SHA that is not an ancestor
# of this repository's public main.

on:
  workflow_run:
    workflows: [CI, Camera end-to-end]
    types: [completed]
    branches: [main]

concurrency:
  group: sync-release-request
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  request:
    name: Request a release of this commit
    # Only a successful gate run from a push to main may propose a release.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Decide whether this commit gets a release request
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: node scripts/release-request.mjs "$RELEASE_SHA" "$GITHUB_RUN_ID"

      - name: Check the release dispatch configuration
        if: steps.decide.outputs.release == 'true'
        env:
          RELEASE_REPOSITORY: ${{ secrets.RELEASE_REPOSITORY }}
          SYNC_PREVIEW_WORKFLOW: ${{ secrets.SYNC_PREVIEW_WORKFLOW }}
        run: |
          missing=""
          [ -n "$RELEASE_REPOSITORY" ] || missing="$missing RELEASE_REPOSITORY"
          [ -n "$SYNC_PREVIEW_WORKFLOW" ] || missing="$missing SYNC_PREVIEW_WORKFLOW"
          if [ -n "$missing" ]; then
            echo "::error::The release dispatch is not configured. Empty or unset secret(s):$missing"
            exit 1
          fi

      - name: Generate a release-scoped dispatch token
        if: steps.decide.outputs.release == 'true'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: Iv23liy6T6BW0BXuZRzx
          private-key: ${{ secrets.EHSRE_APP_PRIVATE_KEY }}
          owner: noisefactorllc
          repositories: ${{ secrets.RELEASE_REPOSITORY }}

      - name: Dispatch the release harness for this exact commit
        if: steps.decide.outputs.release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          RELEASE_REPOSITORY: ${{ secrets.RELEASE_REPOSITORY }}
          SYNC_PREVIEW_WORKFLOW: ${{ secrets.SYNC_PREVIEW_WORKFLOW }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          gh workflow run "$SYNC_PREVIEW_WORKFLOW" \
            --repo "$GITHUB_REPOSITORY_OWNER/$RELEASE_REPOSITORY" \
            --ref main \
            -f sync_sha="$RELEASE_SHA"
          echo "Requested a signed Sync preview release of $RELEASE_SHA"
